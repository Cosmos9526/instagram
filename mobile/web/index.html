<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your creative partner for ad scripts and prompts">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E7C66">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Postyar">
  <link rel="apple-touch-icon" href="icons/postyar-apple.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-postyar.png"/>

  <title>Postyar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <style>
    body { margin: 0; background: #f3f6f5; }
    #startup { position: fixed; inset: 0; display: grid; place-items: center;
      font-family: Tahoma, sans-serif; color: #0b1b22; padding: 28px; text-align: center; }
    #startup section { max-width: 420px; line-height: 1.9; }
    #startup h1 { font-size: 24px; }
    #startup p { color: #52676b; font-size: 14px; }
    #startup button { background: #0b9488; color: white; border: 0; border-radius: 12px;
      padding: 12px 22px; font: inherit; cursor: pointer; }
    #startup button[hidden] { display: none; }
    .pulse { display: inline-block; width: 36px; height: 36px; border: 3px solid #d2e7e2;
      border-top-color: #0b9488; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <div id="startup" role="status" aria-label="Loading" aria-live="polite">
    <section><span class="pulse" aria-hidden="true"></span>
      <p id="startup-message"></p>
      <button id="retry" hidden onclick="location.reload()">Retry</button>
    </section>
  </div>
  <script src="startup.js"></script>
  <script src="flutter_bootstrap.js" async onerror="window.studioLoadFailed()"></script>
</body>
</html>
