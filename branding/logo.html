<html><head><style>
@font-face{font-family:V;font-weight:900;src:url('../backend/app/fonts/Vazirmatn-Black.woff2')}
body{margin:0;background:transparent;font-family:V}
.mark{width:512px;height:512px;border-radius:124px;position:relative;overflow:hidden;
 background:radial-gradient(130% 130% at 85% 0%,#22D3BE 0%,#0B9488 42%,#073F4A 100%)}
.mark .p{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:360px;line-height:1;transform:translateY(-38px)}
.mark .dot{position:absolute;width:84px;height:84px;border-radius:50%;background:#FFB23F;top:46px;right:46px;
 box-shadow:0 0 0 16px rgba(255,178,63,.25)}
#word{display:inline-flex;align-items:center;gap:36px;direction:rtl;padding:30px 40px}
#word .t{font-weight:900;font-size:170px;color:#0B1B22;line-height:1.2}
.s{transform:scale(.4);transform-origin:center;margin:-154px}
</style></head><body>
<div id="icon" class="mark" style="display:inline-block"><div class="dot"></div><div class="p">پ</div></div>
<br>
<div id="word"><div class="s"><div class="mark"><div class="dot"></div><div class="p">پ</div></div></div><div class="t">پستیار</div></div>
</body></html>
<div id="square" class="mark" style="display:inline-block;border-radius:0"><div class="dot"></div><div class="p">پ</div></div>
<div id="maskable" class="mark" style="display:inline-block;border-radius:0"><div style="position:absolute;inset:0;transform:scale(.78)"><div class="dot"></div><div class="p">پ</div></div></div>
